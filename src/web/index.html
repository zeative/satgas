<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fff" />
    <meta name="description" content="A self-hosted workspace where AI coding agents work as a team on a shared canvas." />
    <title>Satgas</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        const saved = document.cookie.match(/(?:^|; )vite-ui-theme=([^;]*)/)?.[1] ?? "system";
        const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
