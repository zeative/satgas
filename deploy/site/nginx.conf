server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # A location's own add_header drops the server's, so every location includes the same security headers.
  location /assets/ {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=604800" always;
  }
  # Requested by content hash (see the Dockerfile), so a copy can be kept for good.
  location ~* \.(css|js)$ {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  # The page itself is checked every time, so a deploy shows at once.
  location / {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
